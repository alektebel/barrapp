[project]
name = "barra"
version = "0.1.0"
description = "Self-referential rep deviation detection: does this rep deviate from the subject's own reference reps by more than their own natural rep-to-rep variation?"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    # Match the Lambda worker's tested OpenCV decoder; version drift changes
    # decoded pixels enough to alter pose detections and rep counts.
    "opencv-python==4.10.0.84",
    "matplotlib",
    "dtaidistance",
    "jinja2",
    "pyarrow",
]

# Pose backends are NOT installed by default. The measurement core is
# dependency-locked (section 1 of the spec); a pose estimator is an extra
# dependency and is opt-in. Pick exactly one:
#   uv pip install -e ".[mediapipe]"     # CPU, fast, 33-kpt BlazePose
#   uv pip install -e ".[ultralytics]"   # CPU/GPU, 17-kpt COCO, YOLO-pose
[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10"]
# The optional chunked CPU path caps torch_utils.NUM_THREADS, an Ultralytics
# internal used by select_device(); keep the tested implementation pinned.
ultralytics = ["ultralytics==8.4.166"]
astra = ["astrapy>=2.0"]

[project.scripts]
barra = "barra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["barra", "barra.pose"]

[tool.setuptools.package-data]
barra = ["templates/*.j2"]

# The suite runs from `tests/` and nowhere else. `server/vendor/` holds a COPY
# of this repository, tests included, built for the Lambda package; left to
# itself pytest walks into it, finds `tests/test_core.py` twice under one
# module name, and refuses to collect anything - eleven collection errors and
# no baseline, from a directory that is not even tracked. importlib import mode
# removes the basename collision as a class of problem rather than this one
# instance of it.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["server/vendor", "build", "dist", ".venv", "out", "llm-council"]
addopts = "--import-mode=importlib"
