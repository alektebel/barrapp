AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: barrapp — upload a clip, measure the muscle-up, return a report.

Parameters:
  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Where the dead-letter alarm is sent. Leave blank and the alarm still
      exists and still fires - it just has nowhere to go, which is how the
      "No module named 'auth'" deploy managed to fail every clip for a day
      with the evidence sitting unread in the queue.
  ApiDomainName:
    Type: String
    Default: api.barrapp.fit
    Description: >-
      The name the app calls. A CNAME at the registrar (Porkbun) points it at
      the ApiDomainTarget output.
  ApiCertificateArn:
    Type: String
    Default: arn:aws:acm:eu-west-1:257394490122:certificate/73af029a-af15-46f2-8f74-38fba02b28bb
    Description: >-
      ACM certificate for *.barrapp.fit in this region, validated by DNS.
      Blank leaves the custom domain out of the stack.
  NanBaseUrl:
    Type: String
    Default: ""
    Description: Base URL of the OpenAI-compatible nan.builder endpoint (root that serves /chat/completions).
  WorkerImageUri:
    Type: String
    Description: >-
      ECR image for the worker, built and pushed by deploy.sh. Built outside
      SAM on purpose: Docker 29 with the containerd snapshotter pushes an OCI
      index that Lambda refuses, so deploy.sh builds with --provenance=false
      and checks the media type before the stack is touched.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        VIDEO_BUCKET: !Ref VideoBucket
        # The written report (server/report.py), through nan.builders.
        BARRA_REPORT_MODEL: glm5.3-flash
        BARRA_REPORT_BACKUP_MODEL: qwen3.8-flash
        NAN_SECRET_ID: barrapp/nan-api-key
        NAN_BASE_URL: !Ref NanBaseUrl
        NAN_MODEL: qwen3.8-flash
        BARRA_ROOT: /opt/barra
        TRACES_TABLE: !Ref TracesTable
        UPLOADS_TABLE: !Ref UploadsTable
        FEEDBACK_TABLE: !Ref FeedbackTable
        REFERRALS_TABLE: !Ref ReferralsTable
        # The referral program's knobs. Credits are only SPENT when
        # REQUIRE_CREDITS is "1"; off, the program grants and shows a balance
        # but never refuses a clip, so turning it on is a deployment decision.
        STARTING_CREDITS: "3"
        REFERRAL_REWARD: "3"
        WELCOME_CREDITS: "1"
        REQUIRE_CREDITS: "0"
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasApiDomain: !Not [!Equals [!Ref ApiCertificateArn, ""]]

Resources:
  VideoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-clips-30d
            Status: Enabled
            ExpirationInDays: 30
          # An expiry rule does NOT touch the parts of an unfinished multipart
          # upload. They do not appear in ListObjects, nothing ages them out,
          # and they are billed: six abandoned uploads had been sitting in this
          # bucket since the day a phone walked away from them. One day is well
          # past the hour a presigned part url stays valid, so nothing a client
          # could still finish is ever cut off here.
          - Id: abort-incomplete-uploads-1d
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # One row per video analysis: the whole decision chain, the keypoint
  # timesteps and the artifacts' names. This is the log a user report is
  # answered from - what the pipeline saw, stage by stage, per clip.
  TracesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: traceId
          AttributeType: S
      KeySchema:
        - AttributeName: traceId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # One row per job, holding every step of its upload: the parts presigned,
  # the ones S3 took, the pauses the phone shipped from its own log, the
  # abandonment or the completion. A job row says what a clip became; this
  # says how it got there, and for the ones that never arrived it is the only
  # thing that ever will.
  UploadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # One row per user feedback submission. No TTL on purpose: feedback stays
  # readable until reviewed, even though its clip expires from the bucket
  # after 30 days with everything else in it.
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # The referral program. One single-key table holds three shapes of row:
  # `acct#<owner>` is that owner's code, credit balance and tally; `code#<CODE>`
  # is the reverse lookup a redeem does; `ref#<owner>` is the one-redemption
  # guard, keyed by the referee so a phone can never cash two codes. No GSI
  # because every access is a direct Get/Put/Update on `id`.
  ReferralsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-Device-Id
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # A stable name for the API (2026-10-11): a phone could not resolve the
  # execute-api host, and that host changes whenever the API is recreated.
  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiDomain
    DependsOn: ApiApiGatewayDefaultStage
    Properties:
      DomainName: !Ref ApiDomain
      ApiId: !Ref Api
      Stage: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Architectures: [x86_64]
      Handler: handler.api
      CodeUri: api/
      Environment:
        Variables:
          WORKER_FUNCTION: !Ref WorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReferralsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UploadsTable
        - S3CrudPolicy:
            BucketName: !Ref VideoBucket
        # The nan.builders key is read at runtime from Secrets Manager, so it
        # is never a template parameter or a plaintext Lambda environment value.
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:barrapp/nan-api-key-*"
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WorkerFunction.Arn
        # The exact set auth.py calls. These are token-authorized operations,
        # but boto3 signs every request with the role's credentials, so IAM is
        # evaluated too and a missing action fails as AccessDenied.
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ResendConfirmationCode
                - cognito-idp:InitiateAuth
                - cognito-idp:GetUser
                - cognito-idp:ForgotPassword
                - cognito-idp:ConfirmForgotPassword
              Resource: !GetAtt UserPool.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /health
            Method: GET

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Timeout: 600
      # Lambda rations CPU by memory (1769 MB per vCPU): 10240 MB is exactly
      # six, what pose in parallel chunks needs to stay inside the round-2
      # budget (docs/SPEED-PLAN.md steps 2-3). BARRA_POSE_WORKERS is unset on
      # purpose - switching chunked pose on is a deploy decision, one line,
      # documented in the plan next to the gate results.
      MemorySize: 10240
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          BARRA_POSE_MODEL: /opt/barra/models/pose_landmarker_heavy.task
          # MiMo does both passes in the worker: localizing the exercise in
          # the raw clip, and the rubric error read over the stills + the
          # geometry's measurements.
          BARRA_VISION_MODEL: mimo-v2.6-flash
          BARRA_LOCALIZE: "1"
          BARRA_LOCALIZE_MODEL: mimo-v2.6-flash
          # /opt/barra is read-only; artifacts and trace JSON go to /tmp.
          BARRA_TRACE_DIR: /tmp/traces
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UploadsTable
        - S3ReadPolicy:
            BucketName: !Ref VideoBucket
        # The worker keeps the clip as uploaded (<job>.original.mp4, a copy:
        # read + put) and overwrites <job>.mp4 with the located exercise.
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${VideoBucket.Arn}/*"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:barrapp/nan-api-key-*"
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt WorkerDLQ.Arn

  # Accounts. Cognito holds the credentials; the API proxies to it so the
  # phone never carries the AWS SDK and the client id stays server-side.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      # No client secret: the API calls Cognito with no credential of its own
      # beyond its IAM role, and USER_PASSWORD_AUTH is what lets it exchange an
      # email and password for tokens on the phone's behalf.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # The clock that finishes what the phone abandoned. Reaping on read can only
  # ever reach the jobs somebody still asks about; the abandoned upload is by
  # definition the one nobody asks about again, which is why eight of them sat
  # untouched in the table for a week.
  SweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Architectures: [x86_64]
      Handler: sweeper.sweep
      CodeUri: api/
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UploadsTable
        - S3CrudPolicy:
            BucketName: !Ref VideoBucket
        # S3CrudPolicy covers objects, not the bucket-level multipart listing:
        # without this the sweep dies on
        #   AccessDenied ... s3:ListBucketMultipartUploads
        # and the abandoned uploads it exists to clean up are never seen.
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucketMultipartUploads
              Resource: !GetAtt VideoBucket.Arn
            - Effect: Allow
              Action:
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource: !Sub "${VideoBucket.Arn}/*"
      Events:
        EveryQuarterHour:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Reap stuck jobs and abort abandoned uploads.

  WorkerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days

  # A dead letter nobody is told about is a log file. The queue held the
  # "Unable to import module 'handler': No module named 'auth'" of a deploy
  # that broke every clip it touched, and the first anyone knew of it was the
  # next time someone went looking.
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: barrapp alarms

  OpsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  WorkerDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        A clip reached the dead-letter queue: the worker failed it three times
        and the phone is showing a spinner that will never resolve.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WorkerDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsTopic

  # Separate from the dead-letter alarm on purpose: an invoke that errors and
  # then succeeds on Lambda's retry never reaches the queue, so the DLQ alarm
  # stays silent through a fault that is failing one clip in three.
  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The worker is throwing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsTopic

  WorkerAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt WorkerDLQ.Arn

Outputs:
  ApiDomainTarget:
    Condition: HasApiDomain
    Description: CNAME target for ApiDomainName at the registrar.
    Value: !GetAtt ApiDomain.RegionalDomainName
  UserPoolId:
    Description: Cognito user pool holding the accounts.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: App client the API uses to sign users in.
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Paste this into gradle.properties as barrapp.apiUrlRelease
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  VideoBucketName:
    Value: !Ref VideoBucket
  UploadsTableName:
    Description: Every upload try, per job. Read it when a clip never arrived.
    Value: !Ref UploadsTable
  ReferralsTableName:
    Description: Referral codes, credit balances and redemptions.
    Value: !Ref ReferralsTable
  WorkerDLQUrl:
    Description: Clips the worker failed three times.
    Value: !Ref WorkerDLQ
  OpsTopicArn:
    Description: Subscribe to this to be told when a clip dead-letters.
    Value: !Ref OpsTopic
