AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: barrapp — upload a clip, measure the muscle-up, return a report.

Parameters:
  DeepSeekApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Leave blank until you have a DeepSeek key.
  NanApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Key for the objectives intake chat (nan.builder). Leave blank to fall back.
  NanBaseUrl:
    Type: String
    Default: ""
    Description: Base URL of the OpenAI-compatible nan.builder endpoint (root that serves /chat/completions).
  WorkerImageUri:
    Type: String
    Description: >-
      ECR image for the worker, built and pushed by deploy.sh. Built outside
      SAM on purpose: Docker 29 with the containerd snapshotter pushes an OCI
      index that Lambda refuses, so deploy.sh builds with --provenance=false
      and checks the media type before the stack is touched.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        VIDEO_BUCKET: !Ref VideoBucket
        DEEPSEEK_API_KEY: !Ref DeepSeekApiKey
        DEEPSEEK_BASE_URL: https://api.deepseek.com
        DEEPSEEK_MODEL: deepseek-chat
        NAN_API_KEY: !Ref NanApiKey
        NAN_BASE_URL: !Ref NanBaseUrl
        NAN_MODEL: qwen3.8-flash
        BARRA_ROOT: /opt/barra
        TRACES_TABLE: !Ref TracesTable
        FEEDBACK_TABLE: !Ref FeedbackTable
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient

Resources:
  VideoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-clips-30d
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # One row per video analysis: the whole decision chain, the keypoint
  # timesteps and the artifacts' names. This is the log a user report is
  # answered from - what the pipeline saw, stage by stage, per clip.
  TracesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: traceId
          AttributeType: S
      KeySchema:
        - AttributeName: traceId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # One row per user feedback submission. No TTL on purpose: feedback stays
  # readable until reviewed, even though its clip expires from the bucket
  # after 30 days with everything else in it.
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-Device-Id
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Architectures: [x86_64]
      Handler: handler.api
      CodeUri: api/
      Environment:
        Variables:
          WORKER_FUNCTION: !Ref WorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
        - S3CrudPolicy:
            BucketName: !Ref VideoBucket
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WorkerFunction.Arn
        # The exact set auth.py calls. These are token-authorized operations,
        # but boto3 signs every request with the role's credentials, so IAM is
        # evaluated too and a missing action fails as AccessDenied.
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ResendConfirmationCode
                - cognito-idp:InitiateAuth
                - cognito-idp:GetUser
                - cognito-idp:ForgotPassword
                - cognito-idp:ConfirmForgotPassword
              Resource: !GetAtt UserPool.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /health
            Method: GET

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Timeout: 600
      MemorySize: 3008
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          BARRA_POSE_MODEL: /opt/barra/models/pose_landmarker_heavy.task
          BARRA_VISION_MODEL: glm5.3-flash
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracesTable
        - S3ReadPolicy:
            BucketName: !Ref VideoBucket
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt WorkerDLQ.Arn

  # Accounts. Cognito holds the credentials; the API proxies to it so the
  # phone never carries the AWS SDK and the client id stays server-side.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      # No client secret: the API calls Cognito with no credential of its own
      # beyond its IAM role, and USER_PASSWORD_AUTH is what lets it exchange an
      # email and password for tokens on the phone's behalf.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  WorkerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days

  WorkerAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt WorkerDLQ.Arn

Outputs:
  UserPoolId:
    Description: Cognito user pool holding the accounts.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: App client the API uses to sign users in.
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Paste this into gradle.properties as barrapp.apiUrlRelease
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  VideoBucketName:
    Value: !Ref VideoBucket
