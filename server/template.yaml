AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: barrapp — upload a clip, measure the muscle-up, return a report.

Parameters:
  DeepSeekApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Leave blank until you have a DeepSeek key.
  NanApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Key for the objectives intake chat (nan.builder). Leave blank to fall back.
  NanBaseUrl:
    Type: String
    Default: ""
    Description: Base URL of the OpenAI-compatible nan.builder endpoint (root that serves /chat/completions).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        VIDEO_BUCKET: !Ref VideoBucket
        DEEPSEEK_API_KEY: !Ref DeepSeekApiKey
        DEEPSEEK_BASE_URL: https://api.deepseek.com
        DEEPSEEK_MODEL: deepseek-chat
        NAN_API_KEY: !Ref NanApiKey
        NAN_BASE_URL: !Ref NanBaseUrl
        NAN_MODEL: qwen3.8-flash
        BARRA_ROOT: /opt/barra
        TRACES_TABLE: !Ref TracesTable

Resources:
  VideoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-clips-30d
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # One row per video analysis: the whole decision chain, the keypoint
  # timesteps and the artifacts' names. This is the log a user report is
  # answered from - what the pipeline saw, stage by stage, per clip.
  TracesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: traceId
          AttributeType: S
      KeySchema:
        - AttributeName: traceId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-Device-Id
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Architectures: [x86_64]
      Handler: handler.api
      CodeUri: api/
      Environment:
        Variables:
          WORKER_FUNCTION: !Ref WorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref VideoBucket
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WorkerFunction.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /health
            Method: GET

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 600
      MemorySize: 3008
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          BARRA_POSE_MODEL: /opt/barra/models/pose_landmarker_heavy.task
          BARRA_VISION_MODEL: glm5.3-flash
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracesTable
        - S3ReadPolicy:
            BucketName: !Ref VideoBucket
    Metadata:
      DockerTag: worker
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  ApiUrl:
    Description: Paste this into gradle.properties as barrapp.apiUrlRelease
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  VideoBucketName:
    Value: !Ref VideoBucket
