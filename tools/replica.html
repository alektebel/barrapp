<!doctype html>
<meta charset="utf-8">
<title>barrapp — screen replica</title>
<!--
  The screens, in a browser, so a layout can be looked at without an Android
  build. The Compose toolchain cannot be fetched in every environment, and a
  screen nobody has seen is a screen nobody has checked.

  What is real here: the colour tokens (copied hex for hex from
  ui/theme/Color.kt), the type scale (Type.kt), the 390dp phone width, the
  copy (Voice.kt and the panes), and BarraFigure and NavGlyph, which are
  line-for-line ports of the drawing code in ui/parts/Figure.kt.

  What is not: the face is whatever sans the machine has rather than the
  device's system font; Material 3 chrome (ripples, state layers, the real
  NavigationBar pill, OutlinedTextField's notch) is hand-drawn and will look
  more finished on a device; there are no window insets; and nothing animates -
  each figure is one frame of the loop.

  So it catches layout, hierarchy, colour and copy. It cannot catch a Compose
  API that moved, a modifier on the wrong scope, or a runtime constraint.

      node tools/replica_shots.mjs      # writes a PNG per screen, both themes

  It has already earned its keep: it caught a dashed baseline drawn under an
  empty trace, a greeting that wrapped the header onto two lines, a held day
  painted in the "nothing came out of this" grey, and a rep-count line whose
  tap target wrapped onto a second line on its own.
-->
<style>
/* Tokens copied hex-for-hex from app/src/main/java/com/barrapp/ui/theme/Color.kt */
.t-light {
  --bg:#F3F6F8; --surface:#FFFFFF; --surfaceVariant:#E7ECF1; --primary:#14618E;
  --onPrimary:#FFFFFF; --secondary:#4A6274; --outline:#C4CDD6; --onBackground:#121B23;
  --onSurfaceVariant:#4C5B69; --error:#8E3A38;
  --strong:#2E7D5B; --solid:#2A6C9C; --shaky:#97671D; --broken:#97413F; --unmeasured:#8494A1;
}
.t-dark {
  --bg:#0C1218; --surface:#141D25; --surfaceVariant:#1D2933; --primary:#74B7E0;
  --onPrimary:#04202D; --secondary:#9EB3C3; --outline:#2B3945; --onBackground:#DEE6ED;
  --onSurfaceVariant:#9AACBB; --error:#DE8A87;
  --strong:#62C097; --solid:#74B4DE; --shaky:#D4A257; --broken:#DE8A87; --unmeasured:#6F808E;
}
* { box-sizing: border-box; }

.wrap { display:flex; flex-wrap:wrap; gap:26px; padding:26px; align-items:flex-start; }
.frame { width:390px; height:844px; overflow:hidden; position:relative;
         background:var(--bg); color:var(--onBackground); border-radius:28px;
         box-shadow:0 6px 24px rgba(0,0,0,.35); }
.caption { font:600 12px "Liberation Sans", sans-serif; color:#fff; letter-spacing:.4px; margin:0 0 6px 4px; }
.col { display:flex; flex-direction:column; }

/* type scale, from Type.kt */
.displaySmall   { font:600 34px/38px "Liberation Sans", sans-serif; letter-spacing:-0.8px; }
.headlineMedium { font:600 26px/31px "Liberation Sans", sans-serif; letter-spacing:-0.5px; }
.headlineSmall  { font:600 21px/26px "Liberation Sans", sans-serif; letter-spacing:-0.3px; }

           overflow:hidden; }

<div class="wrap" id="wrap"></div>
<script>
// ---------------------------------------------------------------------------
// BarraFigure — a line-for-line port of app/src/main/java/com/barrapp/ui/parts/Figure.kt
// (drawV2 below is that port: pose, elbow, taper, body, then the trace lane)
// ---------------------------------------------------------------------------
function pose(w, h, phase) {
  // A PULL-UP: the shoulders rise to the bar and never above it, so the
  // figure can never make the T-pose a support position produces.
  const barY = 0.20*h, cx = 0.5*w, grip = 0.086*w;
  const armLong = 0.155*h, armShort = 0.052*h;
  const torso = 0.135*h;
  const r = Math.pow(Math.sin(Math.PI*phase), 2);
  const sway = 0.012*w*Math.sin(2*Math.PI*phase);
  const reach = armLong - r*(armLong - armShort);
  const shY = barY + reach, shX = cx + sway;
  const hipX = shX + 0.7*sway, hipY = shY + torso;
  // Legs hang, close together, knees a little bent, drifting forward as the
  // body rises. Shorter than the first pass, which had a spider's legs.
  // Legs hang: near vertical, converging slightly, with only a small forward
  // drift as the body rises. The previous knee travel made it march in mid-air.
  const kSpread = 0.022*w, aSpread = 0.015*w;
  const kneeY = hipY + 0.088*h, ankY = kneeY + 0.078*h;
  const kneeX = hipX + 0.018*w*r, ankX = kneeX + 0.012*w*r;
  return {
    barY, cx, grip, reach, armLong, armShort, r, shX, shY, hipX, hipY,
    handL:[cx-grip,barY], handR:[cx+grip,barY],
    shL:[shX-0.050*w,shY], shR:[shX+0.050*w,shY],
    hipL:[hipX-0.030*w,hipY], hipR:[hipX+0.030*w,hipY],
    kneeL:[kneeX-kSpread,kneeY], kneeR:[kneeX+kSpread,kneeY],
    ankL:[ankX-aSpread,ankY], ankR:[ankX+aSpread,ankY],
    headR:0.040*h, headY: shY - 0.080*h, neck:[shX, shY-0.020*h],
  };
}
function elbowOf(p, hand, sh, side, w, h) {
  // The elbow travels from "almost on the line" at the hang to "below the
  // hand, tucked at the ribs" at the top. Interpolating the *position* rather
  // than pushing the midpoint sideways is what stops the arms and the bar
  // closing into a trapezoid at the top - which is what a coat hanger is.
  const flex = (p.armLong - p.reach) / (p.armLong - p.armShort);
  const straight = [(hand[0]+sh[0])/2 + side*0.012*w, (hand[1]+sh[1])/2];
  const tucked   = [hand[0] + side*0.016*w, sh[1] + 0.072*h];
  return [straight[0] + (tucked[0]-straight[0])*flex,
          straight[1] + (tucked[1]-straight[1])*flex];
}

// a stroke that tapers from `w0` at a to `w1` at b - limbs read as limbs
function taper(ctx, a, b, w0, w1, col) {
  const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(a[0]+nx*w0/2, a[1]+ny*w0/2);
  ctx.lineTo(b[0]+nx*w1/2, b[1]+ny*w1/2);
  ctx.lineTo(b[0]-nx*w1/2, b[1]-ny*w1/2);
  ctx.lineTo(a[0]-nx*w0/2, a[1]-ny*w0/2);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(a[0],a[1],w0/2,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(b[0],b[1],w1/2,0,7); ctx.fill();
}

function drawBody(ctx, w, h, phase, col, alpha) {
  const p = pose(w, h, phase);
  const eL = elbowOf(p, p.handL, p.shL, -1, w, h), eR = elbowOf(p, p.handR, p.shR, +1, w, h);
  ctx.globalAlpha = alpha;
  const U = 0.016*h;
  taper(ctx, p.handR, eR, U*0.65, U*0.82, col);
  taper(ctx, eR, p.shR, U*0.82, U*0.92, col);
  taper(ctx, p.hipR, p.kneeR, U*0.92, U*0.78, col);
  taper(ctx, p.kneeR, p.ankR, U*0.78, U*0.52, col);
  taper(ctx, [p.shX,p.shY], [p.hipX,p.hipY], U*1.40, U*1.02, col);
  taper(ctx, p.shL, p.shR, U*0.92, U*0.92, col);
  taper(ctx, p.hipL, p.hipR, U*0.95, U*0.95, col);
  taper(ctx, p.handL, eL, U*0.75, U*0.95, col);
  taper(ctx, eL, p.shL, U*0.95, U*1.05, col);
  taper(ctx, p.hipL, p.kneeL, U*1.02, U*0.86, col);
  taper(ctx, p.kneeL, p.ankL, U*0.86, U*0.58, col);
  taper(ctx, [p.shX,p.shY], p.neck, U*0.82, U*0.72, col);
  ctx.beginPath(); ctx.arc(p.shX, p.headY, p.headR, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  return p;
}

function drawV2(ctx, w, h, phase, stage, c, opt = {}) {
  ctx.clearRect(0,0,w,h);
  ctx.lineCap='round'; ctx.lineJoin='round';
  // the body is laid out against a reference height, not the box - see Figure.kt
  const fh = stage < 0 ? h / 0.66 : h;

  // ---- instrument ground: a faint grid, like the launcher icon ----------
  if (opt.grid === true) {
    ctx.strokeStyle = c.rule; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    const step = h/14;
    for (let y = step; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    for (let x = step; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  // ---- the bar goes BEHIND the body. Drawn over it, it crossed the head
  //      at the top of every rep, where the chin is by definition above it.
  const p0 = pose(w, fh, phase);
  ctx.strokeStyle = c.ink; ctx.lineWidth = 3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0.09*w, p0.barY); ctx.lineTo(0.91*w, p0.barY); ctx.stroke();
  ctx.strokeStyle = c.rule; ctx.lineWidth = 2.5;
  for (const x of [0.12,0.88]) { ctx.beginPath(); ctx.moveTo(x*w,p0.barY); ctx.lineTo(x*w,p0.barY+0.042*fh); ctx.stroke(); }

  // ---- motion ghosts ----------------------------------------------------
  if (opt.ghosts !== false && stage >= 0) {
    for (const [back, a] of [[0.045,0.18]]) {
      drawBody(ctx, w, fh, phase-back, c.primary, a);
    }
  }
  const p = drawBody(ctx, w, fh, phase, c.primary, 1);

  // a short cap of bar over each hand, so the hands read as gripping it
  ctx.strokeStyle = c.ink; ctx.lineWidth = 3.5;
  for (const hand of [p.handL, p.handR]) {
    ctx.beginPath();
    ctx.moveTo(hand[0]-0.022*w, p.barY); ctx.lineTo(hand[0]+0.022*w, p.barY); ctx.stroke();
  }

  // ---- the hands are the reference. Always marked, loud in stage 1. ----
  const strong = stage === 1;
  const pulse = strong ? 0.55 + 0.45*Math.sin(4*Math.PI*phase) : 0.32;
  ctx.strokeStyle = c.primary; ctx.globalAlpha = Math.min(1, Math.max(0.2, pulse));
  ctx.lineWidth = strong ? 1.8 : 1.2;
  const b = strong ? 0.030*w : 0.024*w;
  for (const hand of [p.handL, p.handR]) {
    const [x,y] = hand, k = b*0.55;
    // corner brackets, not a full box: it frames without boxing in
    for (const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      ctx.beginPath();
      ctx.moveTo(x+sx*b, y+sy*b-sy*k); ctx.lineTo(x+sx*b, y+sy*b);
      ctx.lineTo(x+sx*b-sx*k, y+sy*b); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // ---- the trace, in the same frame -------------------------------------
  const tTop = 0.70*h, tBot = 0.955*h, x0 = 0.10*w, x1 = 0.90*w;
  const zero = tTop + (tBot-tTop)*0.16;   // the bar, near the top of the lane
  if (stage >= 2) {
    ctx.strokeStyle = c.rule; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x0,zero); ctx.lineTo(x1,zero); ctx.stroke(); ctx.setLineDash([]);
    const hist = [], N = 64;
    for (let i = 0; i < N; i++) {
      const ph = phase - (N-1-i)*0.042;
      const r = Math.pow(Math.sin(Math.PI*ph),2);
      hist.push(-1 + 1.19*r);        // -1 at the hang, +0.19 over the bar
    }
    const X = i => x0 + (x1-x0)*i/(N-1);
    const Y = v => zero - v*0.84*(tBot-tTop);
    if (stage >= 3) {
      // a soft fill under the curve: the trace reads as a measurement, not a doodle
      const g = ctx.createLinearGradient(0, tTop, 0, tBot);
      g.addColorStop(0, c.primary + '4d'); g.addColorStop(1, c.primary + '00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(X(0), tBot);
      hist.forEach((v,i) => ctx.lineTo(X(i), Y(v)));
      ctx.lineTo(X(N-1), tBot); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = stage >= 3 ? c.primary : c.rule;
    ctx.lineWidth = 2; ctx.beginPath();
    hist.forEach((v,i) => i ? ctx.lineTo(X(i),Y(v)) : ctx.moveTo(X(i),Y(v)));
    ctx.stroke();
    if (stage === 2) {
      const t = 0.5 - 0.5*Math.cos(2*Math.PI*phase);
      const inset = 0.16*(x1-x0)*t;
      ctx.strokeStyle = c.primary; ctx.lineWidth = 1.5;
      for (const x of [x0+inset, x1-inset]) {
        ctx.beginPath(); ctx.moveTo(x, tTop-3); ctx.lineTo(x, tBot+3); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, tTop-6, 2.2, 0, 7); ctx.fillStyle = c.primary; ctx.fill();
      }
    }
    if (stage >= 3) {
      let n = 0;
      for (let i = 1; i < N-1; i++) {
        if (hist[i] > hist[i-1] && hist[i] >= hist[i+1] && hist[i] > 0) {
          n++;
          const x = X(i), y = Y(hist[i]);
          ctx.strokeStyle = c.primary; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, zero); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = c.surface; ctx.beginPath(); ctx.arc(x,y,3.6,0,7); ctx.fill();
          ctx.strokeStyle = c.primary; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x,y,3.6,0,7); ctx.stroke();
        }
      }
      ctx.fillStyle = c.ink;
      ctx.font = '600 13px "Liberation Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(n + (n === 1 ? ' REP' : ' REPS'), x1, tTop - 8);
    }
  }
}

function figure(stage, w, h, phase, c) {
  const el = document.createElement('canvas');
  el.width = w; el.height = h; el.style.width = w+'px'; el.style.height = h+'px';
  drawV2(el.getContext('2d'), w, h, phase, stage, c, {});
  return el;
}

// NavGlyph — ported from the same file
function glyph(kind, on, c) {
  const s = 22, el = document.createElement('canvas');
  el.width = s; el.height = s; el.style.width = el.style.height = s+'px';
  const ctx = el.getContext('2d'), col = on ? c.ink : c.dim;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 1.8;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  if (kind === 'calendar') {
    for (let row = 0; row < 3; row++) for (let col2 = 0; col2 < 4; col2++) {
      const x = s*(0.18 + col2*0.213), y = s*(0.28 + row*0.24);
      const filled = (row===1&&col2===2) || (row===2&&col2===0);
      ctx.globalAlpha = filled ? 1 : 0.55;
      ctx.beginPath(); ctx.arc(x, y, s*(filled?0.075:0.05), 0, 2*Math.PI); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (kind === 'session') {
    const L = (a,b,cc,d) => { ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(cc,d); ctx.stroke(); };
    L(s*0.1, s*0.42, s*0.9, s*0.42);
    ctx.beginPath(); ctx.arc(s*0.5, s*0.24, s*0.11, 0, 2*Math.PI); ctx.fill();
    L(s*0.5, s*0.42, s*0.5, s*0.86);
    L(s*0.33, s*0.42, s*0.4, s*0.58);
    L(s*0.67, s*0.42, s*0.6, s*0.58);
  } else {
    ctx.beginPath();
    ctx.moveTo(s*0.12, s*0.78); ctx.lineTo(s*0.36, s*0.6);
    ctx.lineTo(s*0.55, s*0.68); ctx.lineTo(s*0.88, s*0.26);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.88, s*0.26, s*0.07, 0, 2*Math.PI); ctx.fill();
  }
  return el;
}

// ScoreRing — ported from parts/Parts.kt
function ring(score, bandCol, d, caption, c) {
  const box = document.createElement('div');
  box.style.cssText = 'display:flex;flex-direction:column;align-items:center';
  const el = document.createElement('canvas');
  el.width = d; el.height = d; el.style.width = el.style.height = d+'px';
  const ctx = el.getContext('2d');
  const stroke = d*0.10, rr = (d-stroke)/2;
  ctx.lineWidth = stroke; ctx.lineCap = 'round';
  ctx.strokeStyle = c.rule + '73';
  ctx.beginPath(); ctx.arc(d/2, d/2, rr, 0, 2*Math.PI); ctx.stroke();
  if (score !== null) {
    ctx.strokeStyle = bandCol;
    ctx.beginPath(); ctx.arc(d/2, d/2, rr, -Math.PI/2, -Math.PI/2 + 2*Math.PI*score/100); ctx.stroke();
  }
  const holder = document.createElement('div');
  holder.style.cssText = `position:relative;width:${d}px;height:${d}px`;
  holder.appendChild(el);
  const t = document.createElement('div');
  t.textContent = score === null ? '—' : score;
  t.style.cssText = `position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:600 ${d*0.30}px "Roboto Mono",monospace;color:${score===null?c.dim:bandCol}`;
  holder.appendChild(t);
  box.appendChild(holder);
  if (caption) {
    const cp = document.createElement('div');
    cp.className = 'labelMedium'; cp.textContent = caption.toUpperCase();
    cp.style.cssText = `color:${c.dim};margin-top:6px`;
    box.appendChild(cp);
  }
  return box;
}

// RepTrace
function repTrace(points, col, c, w = 300, h = 56) {
  const el = document.createElement('canvas');
  el.width = w; el.height = h; el.style.width='100%'; el.style.height = h+'px';
  const ctx = el.getContext('2d');
  const lo = Math.min(...points), hi = Math.max(...points);
  const span = (hi-lo) > 1e-4 ? (hi-lo) : 1, pad = h*0.12;
  const y = v => h - pad - (v-lo)/span*(h-2*pad);
  const x = i => i/(points.length-1)*w;
  if (lo < 0 && hi > 0) {
    ctx.strokeStyle = c.rule; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(0, y(0)); ctx.lineTo(w, y(0)); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  points.forEach((v,i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.stroke();
  return el;
}

// ---------------------------------------------------------------------------
// markup helpers
// ---------------------------------------------------------------------------
const h = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
const panel = (...kids) => { const p = h('div','panel'); kids.forEach(k => p.appendChild(typeof k === 'string' ? h('div',null,k) : k)); return p; };
const eyebrow = t => h('div','labelMedium eyebrow', t.toUpperCase());
const pill = (t, col) => { const p = h('div','pill labelSmall', t);
  p.style.cssText = `color:${col};background:color-mix(in srgb, ${col} 10%, transparent)`; return p; };
const gap = n => { const s = h('div'); s.style.height = n+'px'; return s; };

const PLUS = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
  stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;

}
function navbar(active, c) {
  const n = h('div','navbar');

  for (const [kind, label] of items) {
    const it = h('div','navitem');

      const svg = h('div', null, PLUS.replace('32','24').replace('32','24'));
      svg.querySelector('svg').style.stroke = c.dim;
      p.appendChild(svg);
    } else p.appendChild(glyph(kind, kind === active, c));
    it.appendChild(p);
    it.appendChild(h('div','navlabel' + (kind === active ? ' on' : ''), label));

}

function screenProcessing(stage, phase, elapsed, guess, c) {
  const body = h('div','body');
  const wrap = h('div');
  wrap.style.cssText = 'height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 32px';
  const top = h('div','row'); top.style.width = '100%';
  top.appendChild(h('div','headlineSmall','Measuring'));
  const sp = h('div','grow'); top.appendChild(sp);
  top.appendChild(h('div','labelMedium dim', elapsed + 's'));
  wrap.appendChild(top);
  wrap.appendChild(gap(8));
  wrap.appendChild(figure(stage, 220, 240, phase, c));
  wrap.appendChild(gap(10));

  const stages = [
    ['Uploading the clip', 'Sending the footage. This is the only part that depends on your Wi-Fi.'],
    ['Finding the exercise', 'Checking whether the shoulders ever finish above the hands. That one line is the whole pull-up / muscle-up split.'],
    ['Trimming to the working set', 'Cutting the walk to the bar and the walk away. They are not the exercise.'],
    ['Counting and measuring the reps', 'A rep it cannot measure gets a dash, not a low score. That is on purpose.'],
  ];
  stages.forEach(([name, line], i) => {
    const done = i < stage, active = i === stage;
    const col = h('div'); col.style.cssText = 'width:100%;padding:5px 0';
    const r = h('div','row'); r.style.gap = '12px';
    const dot = h('div','dot');
    dot.style.background = done ? c.primary + '80' : active ? c.primary : c.rule;
    r.appendChild(dot);
    const t = h('div', active ? 'titleSmall' : 'bodyMedium', name);
    t.style.color = active ? c.ink : done ? c.dim : c.dim + '80';
    r.appendChild(t);
    col.appendChild(r);
    if (active) {
      const l = h('div','bodySmall dim', line);
      l.style.cssText = 'padding:4px 0 0 20px'; col.appendChild(l);
    }
    wrap.appendChild(col);
  });
  if (guess) {
    wrap.appendChild(gap(12));
    wrap.appendChild(pill('Looks like ' + guess, c.primary));
  }
  wrap.appendChild(gap(18));
  wrap.appendChild(h('div','textbtn','Cancel'));
  body.appendChild(wrap);
  return [body];
}

function componentBar(name, value, why, weight, c) {
  const col = h('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:4px';
  const r = h('div','row');
  r.appendChild(h('div','titleSmall', name[0].toUpperCase()+name.slice(1)));
  r.appendChild(h('div','grow'));
  r.appendChild(h('div','labelMedium dim', Math.round(value*100)+'%'));
  col.appendChild(r);
  const bar = h('div','compbar'); const fill = h('i'); fill.style.width = (value*100)+'%';
  bar.appendChild(fill); col.appendChild(bar);
  col.appendChild(h('div','bodySmall dim', why));
  const w = h('div','labelSmall dim','weight ' + Math.round(weight*100) + '%');
  w.style.opacity = '.7'; col.appendChild(w);
  return col;
}

function screenCalendar(c) {
  const body = h('div','body');
  body.appendChild(header('Diego', c));
  const wrap = h('div'); wrap.style.padding = '0 16px';
  const nav = h('div','row');
  nav.style.cssText = 'padding:8px 0;justify-content:space-between';
  nav.appendChild(h('div','textbtn','‹'));
  nav.appendChild(h('div','titleMedium','August 2026'));
  nav.appendChild(h('div','textbtn','›'));
  wrap.appendChild(nav);
  const dows = h('div','row');
  ['M','T','W','T','F','S','S'].forEach(d => {
    const e = h('div','labelSmall dim', d);
    e.style.cssText = 'flex:1;text-align:center'; dows.appendChild(e);
  });
  wrap.appendChild(dows);
  // August 2026 starts on a Saturday
  const marks = {10:'solid', 14:'strong', 19:null, 26:'strong', 27:'held', 28:'solid'};
  const cells = [null,null,null,null,null].concat(Array.from({length:31},(_,i)=>i+1));
  for (let wk = 0; wk < 6; wk++) {
    const row = h('div','row');
    for (let d = 0; d < 7; d++) {
      const day = cells[wk*7+d];
      const cell = h('div','cell');
      if (day) {
        const band = marks[day];
        const sel = day === 27;
        if (sel) cell.style.cssText += `background:color-mix(in srgb, ${c.primary} 12%, transparent);border:1px solid ${c.primary}`;
        const n = h('div','bodySmall mono', day);
        n.style.color = band ? c.ink : (day===31 ? c.primary : c.dim + '8c');
        cell.appendChild(n);
        const dot = h('div','dot');
        if (band === 'held') dot.style.background = c.primary;
        else if (band) dot.style.background = c[band];
        else if (band === null && day in marks) dot.style.cssText += `border:1px solid ${c.dim}`;
        else dot.style.background = 'transparent';
        cell.appendChild(dot);
      }
      row.appendChild(cell);
    }
    wrap.appendChild(row);
  }
  wrap.appendChild(gap(18));
  wrap.appendChild(h('div','divider'));
  wrap.appendChild(gap(14));
  wrap.appendChild(eyebrow('This month'));
  wrap.appendChild(gap(8));
  const rows = [
    ['Inverted hang','held 11 s · 08-27','11s', c.primary, true],
    ['Muscle-up','3 reps · 08-26','74', c.strong],
    ['Push-up','19 reps · 08-19','—', c.unmeasured],
    ['Muscle-up','2 reps · 08-14','78', c.strong],
  ];
  rows.forEach(([label, sub, score, col, sel]) => {
    const r = h('div','row');
    r.style.cssText = 'gap:12px;padding:10px;border-radius:10px' +
      (sel ? `;background:color-mix(in srgb, ${c.primary} 8%, transparent)` : '');
    const d = h('div'); d.style.cssText = `width:8px;height:8px;border-radius:50%;background:${col}`;
    r.appendChild(d);
    const cl = h('div','grow');
    cl.appendChild(h('div','titleSmall', label));
    cl.appendChild(h('div','bodySmall dim', sub));
    r.appendChild(cl);
    const sc2 = h('div','titleMedium mono', score);
    sc2.style.color = col; sc2.style.fontWeight = '600';
    r.appendChild(sc2);
    wrap.appendChild(r);
  });
  body.appendChild(wrap);
  return [body, navbar('calendar', c)];
}

const SCREENS = [
  ['Empty state', screenEmpty],
  ['Processing · finding the exercise', c => screenProcessing(1, 0.42, 6, null, c)],
  ['Processing · counting the reps', c => screenProcessing(3, 0.5, 34, 'Muscle-up', c)],
  ['Session · a measured set', c => screenSessionSet(c)],

  ['Session · a hold', screenSessionHold],
  ['Calendar', screenCalendar],
  ['Home · a result lands', screenBanner],
  ['Plan', screenPlan],

function tokens(theme) {
  const probe = document.createElement('div');
  probe.className = 't-' + theme;
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const get = n => cs.getPropertyValue('--' + n).trim();
  const t = {primary:get('primary'), ink:get('onBackground'), dim:get('onSurfaceVariant'),
    rule:get('outline'), strong:get('strong'), solid:get('solid'), shaky:get('shaky'),
    broken:get('broken'), unmeasured:get('unmeasured')};
  probe.remove();
  return t;
}

const wrap = document.getElementById('wrap');
for (const theme of ['light','dark']) {
  const c = tokens(theme);
  for (const [name, build] of SCREENS) {
    const col = h('div','col');
    col.appendChild(h('div','caption', name + ' — ' + theme));
    const f = h('div','frame t-' + theme);
    build(c).forEach(part => f.appendChild(part));
    col.appendChild(f);
    wrap.appendChild(col);
  }
}
