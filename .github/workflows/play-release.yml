name: Play release

# Compila el .aab firmado y lo sube a Google Play.
#   - al empujar una etiqueta vX.Y.Z: sube a la pista "internal" (pruebas internas)
#   - a mano (Actions → Play release → Run workflow): eliges la pista
# Promocionar a producción: desde Play Console, o volviendo a lanzarlo con
# track=production. El versionCode de app/build.gradle.kts debe subir en cada
# release: Play rechaza uno ya usado.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   PLAY_KEYSTORE_BASE64   keystore de subida:  base64 -w0 keystore/barrapp-release.jks
#   PLAY_KEYSTORE_PASSWORD contraseña del almacén (storePassword)
#   PLAY_KEY_ALIAS         alias de la clave (barrapp)
#   PLAY_KEY_PASSWORD      contraseña de la clave (keyPassword)
#   PLAY_SERVICE_ACCOUNT_JSON  JSON de la cuenta de servicio con acceso a la API de Play
# Ver docs/PLAY.md → «Subida automática».

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Pista de Play (internal, alpha, beta, production)
        default: internal
        required: true
      status:
        description: completed, o draft si la app aún no está publicada
        default: completed
        required: true

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Restore the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "falta el secreto PLAY_KEYSTORE_BASE64"; exit 1; }
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/barrapp-release.jks
          {
            echo "storeFile=keystore/barrapp-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Check the bundle is signed
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB" | head -3

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fitness.barrapp
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: barrapp-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -rf keystore keystore.properties
