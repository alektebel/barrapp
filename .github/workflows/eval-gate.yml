name: Eval gate

# The regression gate: golden-clip metrics against the committed baseline.
# The eight reviewed VID-*.mp4 clips run through the measurement core on
# cached keypoints (extraction held fixed, so two runs differ only in
# code), grade against data/evaluation/sample_manifest.json, and compare
# with out/eval/baseline/grade.json. A drop past tolerance fails the job.
#
# The LLM judge does NOT run here: it needs a key and grades prose, not
# measurement. The deterministic reference check (hallucinated numbers)
# runs wherever prose exists in a payload, which costs nothing.

on:
  push:
    paths:
      - "barra/**"
      - "scripts/eval_runner.py"
      - "data/evaluation/**"
      - "tests/test_eval_layer.py"
      - ".github/workflows/eval-gate.yml"
  pull_request:
    paths:
      - "barra/**"
      - "scripts/eval_runner.py"
      - "data/evaluation/**"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Eval-layer unit tests
        run: python -m pytest tests/test_eval_layer.py tests/test_evaluate_runner.py -q

  gate:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with a pose backend; mediapipe is CPU-fast)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mediapipe]" pytest
      - name: Install yt-dlp (fetch path exercised by tests only)
        run: pipx install yt-dlp
      - name: Run the golden set and gate against the committed baseline
        run: |
          python scripts/eval_runner.py --mode cached --gate
      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: out/eval/**/summary.txt
