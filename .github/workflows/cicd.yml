name: CICD

# The full pipeline for the whole project, with eval tests on every stage:
#
#   test ──► package ──► deploy (aws) ──► release (tags)
#     │           │            │
#   python    vendor the    post-deploy smoke: /health + one golden clip
#   suite     worker image  through the REAL deployed API, judged by the
#   android   + SAM build   same eval layer that gates the repo
#   unit
#
# Eval coverage per stage:
#   test     tests/test_eval_layer.py + the golden set on cached keypoints
#            (barra/eval/gate.py vs out/eval/baseline/grade.json) - a metric
#            drop blocks before anything is packaged.
#   deploy   the deployed stack's own /health, then a golden clip uploaded
#            through the real API and its payload graded with
#            barra.eval.golden - the eval tests the deployed pipeline, not
#            just the code.
#   release  only after deploy's smoke passed on the same commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  STACK: sam-app

jobs:
  # ---------------------------------------------------------------------
  # 1. TEST - everything that runs without cloud credentials
  # ---------------------------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install barra + mediapipe
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mediapipe]" pytest
      - name: Eval-layer unit tests (grading, gate, judge degradation)
        run: python -m pytest tests/test_eval_layer.py tests/test_evaluate_runner.py -q
      - name: Full python suite
        run: python -m pytest tests/ -q
      - name: Golden set + gate (cached keypoints, committed baseline)
        run: python scripts/eval_runner.py --mode cached --gate

  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure-logic Kotlin tests (plain JVM, no Android toolchain needed)
        run: tools/run_logic_tests.sh
      - name: Kotlin import discipline
        run: python3 tools/check_imports.py app/src/main/java || true
      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug APK builds
        run: ./gradlew assembleDebug --stacktrace

  # ---------------------------------------------------------------------
  # 2. PACKAGE - build the worker image exactly as deploy.sh does, so a
  #    media-type surprise fails here instead of in a stack update
  # ---------------------------------------------------------------------
  package:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test-python, test-android]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC into AWS; no long-lived keys in secrets
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Vendor barra into the worker context
        run: bash server/vendor_barra.sh
      - name: Build the worker image (deploy.sh's exact flags)
        id: tag
        env:
          REPO: ${{ secrets.WORKER_ECR_REPO }}
        run: |
          TAG="worker-${GITHUB_SHA::12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker buildx build \
            --provenance=false --sbom=false \
            --output type=docker,oci-mediatypes=false \
            -t "$REPO:$TAG" server/
      - name: Push and assert the manifest media type Lambda accepts
        env:
          REPO: ${{ secrets.WORKER_ECR_REPO }}
        run: |
          TAG="worker-${GITHUB_SHA::12}"
          docker push "$REPO:$TAG"
          MEDIA=$(aws ecr describe-images \
            --repository-name "${REPO#*/}" --region "$AWS_REGION" \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageManifestMediaType' --output text)
          if [ "$MEDIA" != "application/vnd.docker.distribution.manifest.v2+json" ]; then
            echo "media type $MEDIA; Lambda needs v2 schema 2" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------
  # 3. DEPLOY - protected environment; the eval layer grades the REAL
  #    pipeline after the stack update
  # ---------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install SAM CLI
        run: pipx install aws-sam-cli
      - name: SAM build (API zip, in-container for runtime match)
        run: sam build --use-container ApiFunction
      - name: Deploy the stack
        env:
          REPO: ${{ secrets.WORKER_ECR_REPO }}
        run: |
          TAG="worker-${GITHUB_SHA::12}"
          sam deploy \
            --stack-name "$STACK" \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --image-repository "$REPO" \
            --parameter-overrides \
              "WorkerImageUri=$REPO:$TAG" \
              "NanApiKey=${{ secrets.NAN_API_KEY }}" \
              "NanBaseUrl=${{ secrets.NAN_BASE_URL }}" \
              "DeepSeekApiKey=${{ secrets.DEEPSEEK_API_KEY }}"

      # ---- post-deploy eval: the pipeline as deployed ---------------
      - name: Smoke the deployed API
        id: smoke
        run: |
          API=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "url=$API" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$API/health")
          echo "GET /health -> $CODE"
          [ "$CODE" = "200" ] || { echo "deployed API failed /health"; exit 1; }

      - name: Eval one golden clip through the REAL deployed pipeline
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          NAN_BASE_URL: ${{ secrets.NAN_BASE_URL }}
        run: |
          pip install -e ".[mediapipe]" pytest
          python scripts/deploy_smoke_eval.py \
            --api "${{ steps.smoke.outputs.url }}" \
            --clip VID-20260827-WA0010.mp4 --exercise auto

  # ---------------------------------------------------------------------
  # 4. RELEASE - signed AAB only after the deployed pipeline passed eval
  # ---------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test-python, test-android, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/barrapp-release.jks
          {
            echo "storeFile=barrapp-release.jks"
            echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Bundle the signed release AAB
        run: ./gradlew bundleRelease --stacktrace
      - name: Upload the AAB to the release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
